<!doctype html>
<html lang="sv"><meta charset="utf-8">
<!-- Delningsbilden (1200×630). Rendera om med tools/render.sh. -->
<style>
  @font-face { font-family: "Familjen Grotesk"; src: url("../site/fonts/familjen-grotesk-latin.woff2"); font-weight: 400 700; }
  @font-face { font-family: "Figtree"; src: url("../site/fonts/figtree-latin.woff2"); font-weight: 300 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f6f7f6; color: #191d1c; font-family: "Figtree", sans-serif; }
  .og { box-sizing: border-box; width: 1200px; height: 630px; padding: 80px 90px; display: flex; flex-direction: column; justify-content: space-between; border-bottom: 14px solid #c62a36; }
  .logo { display: flex; align-items: center; gap: 16px; font-family: "Familjen Grotesk", sans-serif; font-weight: 700; font-size: 34px; }
  .mark { width: 52px; height: 52px; border-radius: 14px; background: #c62a36; display: grid; place-items: center; }
  .mark svg { width: 24px; height: 24px; }
  h1 { font-family: "Familjen Grotesk", sans-serif; font-weight: 700; font-size: 76px; line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 22px; max-width: 900px; }
  p { font-size: 30px; color: #5d6663; margin: 0; }
</style>
<div class="og">
  <div class="logo"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>Medges Ej</div>
  <div>
    <h1>Vardagen säger nej.<br>Våra appar säger ja.</h1>
    <p>Appar för vardagen i Stockholm · medgesej.se</p>
  </div>
</div>
</html>
